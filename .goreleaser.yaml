version: 2

project_name: lunacli

before:
  hooks:
    - go mod tidy

builds:
  - id: luna
    main: ./main.go
    binary: luna
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: luna
    ids:
      - luna
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  github:
    owner: ba0f3
    name: lunacli

homebrew_casks:
  - name: luna
    ids:
      - default
    binaries:
      - luna
    homepage: https://github.com/ba0f3/lunacli
    description: Zero-trust stdio MCP server for secure remote SSH commands
    repository:
      owner: ba0f3
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/luna"] if OS.mac?