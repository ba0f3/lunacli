version: 2

project_name: lunacli

before:
  hooks:
    - go mod tidy

builds:
  - id: luna
    main: ./main.go
    binary: luna
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: ssh-debug
    main: ./cmd/ssh-debug
    binary: luna-ssh-debug
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - ids:
      - luna
      - ssh-debug
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  github:
    owner: ba0f3
    name: lunacli

homebrew_casks:
  - name: lunacli
    ids:
      - default
    binaries:
      - lunacli
    homepage: https://github.com/ba0f3/lunacli
    description: Agent-first CLI for the Luna API
    repository:
      owner: ba0f3
      name: lunacli
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/luna"] if OS.mac?