# Luna host inventory (optional)
# See docs/zero-trust-interceptor.md

version: 1

hosts:
  - alias: web-prod-1
    host: ubuntu@10.0.1.10
    tags: [web, production]
    description: Production web server 1

  - alias: web-prod-2
    host: ubuntu@10.0.1.11
    tags: [web, production]
    description: Production web server 2

  - alias: db-staging
    host: postgres@10.0.2.20:2222
    tags: [database, staging]
    description: Staging PostgreSQL (non-default SSH port)

  - alias: monitoring
    host: admin@10.0.3.5
    tags: [monitoring, infrastructure]
    description: Prometheus and Grafana

  # Local development example (adjust user/host)
  - alias: dev-box
    host: ubuntu@127.0.0.1
    tags: [dev]
    description: Local VM or test host
